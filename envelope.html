<body class="envelope-body">
  <main class="cover-screen">
    <div class="cover-petal cover-petal-one" aria-hidden="true"></div>
    <div class="cover-petal cover-petal-two" aria-hidden="true"></div>
    <div class="cover-petal cover-petal-three" aria-hidden="true"></div>

  <script src="site-config.js?v=invitation-site-bride-20261028-02"></script>
  <script>
    (function () {
      const config = window.WEDDING_CONFIG || {};
      const groom = document.querySelector('[data-cover-name="groom"]');
      const bride = document.querySelector('[data-cover-name="bride"]');
      if (groom && config.groomName) groom.textContent = config.groomName;
      if (bride && config.brideName) bride.textContent = config.brideName;
    })();
  </script>
